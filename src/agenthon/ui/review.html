<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark;--paper:#fff;--ink:#172f34;--quiet:#47636a;--line:#d2dfdc;--wash:#f5f9f7;--accent:#116951;--tint:#e1f1e9}
@media(prefers-color-scheme:dark){:root{--paper:#192625;--ink:#eef5ef;--quiet:#b2cbc3;--line:#3e514c;--wash:#20302c;--accent:#96dabe;--tint:#26483b}}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.55 system-ui,sans-serif}
article{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
header,.content,footer{padding:16px clamp(14px,3vw,26px)}header{background:var(--wash);border-bottom:1px solid var(--line)}
h2,h3,p,ul{margin:0}h2{font-size:clamp(20px,4vw,24px);letter-spacing:-.035em}h3,label{font-size:15px;font-weight:700}
header p,.hint{color:var(--quiet);font-size:13px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{background:var(--paper);border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;overflow-wrap:anywhere}
.badge::before{content:'';display:inline-block;background:#bb7416;border-radius:50%;width:7px;height:7px;margin-right:6px}.high::before{background:#c54c44}.low::before{background:#258568}
.original{font-weight:650}.bar,footer{display:flex;gap:10px;align-items:center;justify-content:space-between}.bar{margin-bottom:10px}
#preview{line-height:1.65;overflow-wrap:anywhere}#preview p+p,#preview ul,#preview h3:not(:first-child){margin-top:12px}#preview pre{white-space:pre-wrap}
button{cursor:pointer;font:600 13px/1.35 system-ui;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 13px}
button:disabled{cursor:default;opacity:.65}button:hover{border-color:var(--accent)}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:#115d49;color:#fff;border-color:#115d49}button.primary:hover{background:#094b39}
button.mask{font:600 .85em/1.3 ui-monospace,monospace;background:var(--tint);color:var(--accent);border:0;border-bottom:1px dashed currentColor;border-radius:4px;padding:2px 5px}
button.mask[aria-pressed=true]{background:var(--wash);color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:230px;max-height:65vh;font:inherit;line-height:1.65;border-radius:10px;border:1px solid var(--accent);color:var(--ink);padding:14px;background:var(--paper)}
.hint{margin-top:8px}.guidance{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}.guidance:empty{display:none}
summary{font-weight:650;cursor:pointer;padding:4px 0}details ul{padding-left:22px;font-size:14px}details+details{margin-top:6px}
footer{border-top:1px solid var(--line);align-items:flex-end;justify-content:flex-end;flex-wrap:wrap;background:var(--wash)}
.approval-action{display:grid;gap:4px}
.approval-action:has(button[hidden]){display:none}
button[data-choice=approve]{display:grid}
.approval-label,.approval-progress{grid-area:1/1}
.approval-progress,button[aria-busy=true] .approval-label{visibility:hidden}
button[aria-busy=true] .approval-progress{visibility:visible}
#approval-status{contain:inline-size;text-align:center;overflow-wrap:anywhere}
#approval-status:empty{display:none}
footer [data-choice=local_simulated]{margin-right:auto}.muted{color:var(--quiet);font-size:12px}
[hidden]{display:none!important}@media(max-width:470px){footer{align-items:stretch}footer button,footer .approval-action{flex:1 1 auto}footer [data-choice=local_simulated]{flex-basis:100%}}
@media(min-width:660px){
 .content:has(.guidance:not(:empty)):has(#draft[hidden]){display:grid;grid-template-columns:minmax(0,1.8fr) minmax(170px,1fr);gap:22px}
 .content:has(#draft[hidden]) .guidance{margin:0;padding:0 0 0 16px;border-top:0;border-left:1px solid var(--line)}
}
</style>
<article data-reference="$token">
<header><h2>Review before sending</h2><p>$reason</p>$badges</header>
<section class="content">
<div class="work-area"><div class="bar"><h3 id="preview-title" $preview_hidden>Prompt preview</h3><label id="edit-label" for="draft" $edit_hidden>Edit prompt</label>$edit_button</div>
<div id="preview" $preview_hidden>$preview</div>
<p id="mask-help" class="hint" $hint_hidden>Click a highlighted item to reveal it. Only placeholders are sent.</p>
<textarea id="draft" $edit_hidden aria-describedby="edit-help">
$draft</textarea>
<div id="edit-help" class="hint" $edit_hidden>Personal information is checked again before sending.</div>
</div><div class="guidance">$guidance</div>
</section>
<footer>$actions</footer></article>
<script>
const el=id=>document.getElementById(id);
const draft=el('draft'), preview=el('preview'), token=document.querySelector('article').dataset.reference;
const originals=new Map(Array.from(document.querySelectorAll('.original'),el=>[el.dataset.label,el.textContent]));
const walker=document.createTreeWalker(preview,NodeFilter.SHOW_TEXT), nodes=[];
while(walker.nextNode())nodes.push(walker.currentNode);
for(const node of nodes){
 const parts=node.textContent.split(/(\[(?:NAME|EMAIL|PHONE|SSN|CONTRACT_ID)_[1-9][0-9]*\])/g);
 if(!parts.some(p=>originals.has(p)))continue;
 node.replaceWith(...parts.map(part=>{
   if(!originals.has(part))return document.createTextNode(part);
   const b=document.createElement('button');b.type='button';b.className='mask';b.dataset.label=part;
   b.textContent=part;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','Reveal '+part);return b;
 }));
}
preview.onclick=e=>{
 const item=e.target.closest('.mask');if(!item)return;
 const label=item.dataset.label, reveal=item.getAttribute('aria-pressed')==='false';
 for(const b of preview.querySelectorAll('.mask')){
  if(b.dataset.label!==label)continue;
  b.textContent=reveal?originals.get(label):label;b.setAttribute('aria-pressed',String(reveal));
  b.setAttribute('aria-label',(reveal?'Hide ':'Reveal ')+b.textContent);
 }
};
function editing(on){
 preview.hidden=el('preview-title').hidden=on;
 el('mask-help').hidden=on||!originals.size;
 draft.hidden=el('edit-help').hidden=el('edit-label').hidden=!on;
 document.querySelectorAll('[data-mode]').forEach(b=>b.hidden=b.dataset.mode!==(on?'edit':'preview'));
 for(const note of document.querySelectorAll('.guidance details')){
  if(on){note.dataset.wasOpen=String(note.open);note.open=false;}
  else{note.open=note.dataset.wasOpen==='true';}
 }
 if(on){draft.style.height=Math.min(Math.max(draft.scrollHeight+4,230),window.innerHeight*.65)+'px';draft.focus();}
 else{draft.value=draft.defaultValue;el('edit').focus();}
}
el('edit')?.addEventListener('click',()=>editing(true));
el('cancel')?.addEventListener('click',()=>editing(false));
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
 if(b.dataset.choice==='edit'&&!draft.value.trim()){draft.focus();draft.setCustomValidity('Enter a prompt to continue.');draft.reportValidity();return}
 // Open WebUI displays the submitted text in its confirmation dialog.
 const tag=String.fromCodePoint(0xe0001,...Array.from(token,c=>0xe0000+c.codePointAt(0)),0xe007f);
 const text=b.dataset.command+(b.dataset.choice==='edit'?'\n\n'+draft.value:'')+tag;
 const submit=()=>parent.postMessage({type:'input:prompt:submit',text},'*');
 if(b.dataset.choice!=='approve'){submit();return}
 b.disabled=true;
 const status=el('approval-status');
 status.textContent='';
 b.setAttribute('aria-busy','true');
 function unavailable(){
  window.removeEventListener('message',onApproval);
  b.disabled=false;
  b.removeAttribute('aria-busy');
  status.textContent='Could not send. Try again or reopen the request.';
 }
 function onApproval(event){
  if(event.source!==parent||event.data?.token!==token)return;
  if(event.data.type==='tdb:approval-dispatched')clearTimeout(fallback);
  if(event.data.type==='tdb:approval-failed')unavailable();
 }
 const fallback=setTimeout(unavailable,800);
 window.addEventListener('message',onApproval);
 parent.postMessage({type:'tdb:approve',token},'*');
});
draft.oninput=()=>draft.setCustomValidity('');
new ResizeObserver(()=>parent.postMessage({type:'iframe:height',height:document.body.scrollHeight},'*')).observe(document.body);
</script></html>
